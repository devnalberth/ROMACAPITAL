<!doctype html><meta charset="utf-8"><pre id="probe">…</pre>
<iframe id="f" src="contempladas.html" width="390" height="850" style="border:0"></iframe>
<script>
document.getElementById('f').addEventListener('load', () => setTimeout(() => {
  const d=document.getElementById('f').contentDocument, w=document.getElementById('f').contentWindow;
  const v=d.querySelector('.hero-video'); const r=v.getBoundingClientRect();
  const cs=w.getComputedStyle(v);
  // com object-fit: cover, calcula que faixa do quadro fica visível
  const escala = Math.max(r.width/1280, r.height/720);
  const larguraEscalada = 1280*escala;
  const excesso = larguraEscalada - r.width;
  const pos = parseFloat(cs.objectPosition) / 100;
  const inicio = (excesso*pos)/larguraEscalada*100;
  const fim = inicio + (r.width/larguraEscalada*100);
  document.getElementById('probe').textContent=
    'vídeo na tela: '+r.width.toFixed(0)+'x'+r.height.toFixed(0)
   +'  object-position='+cs.objectPosition
   +'\n   faixa visível do quadro: '+inicio.toFixed(0)+'% a '+fim.toFixed(0)+'%'
   +'   (o homem fica ~82% a 98%)'
   +'\n   homem visível: '+(fim>84?'SIM ✓':'NÃO ✗');
}, 3000));
</script>
